<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Do código à operação — Vinicius Lago Cruz</title>
  <desc id="desc">Banner azul profundo com tipografia clara, detalhes verdes e três planos conectados representando produto, dados e operação.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#B6C4D6" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="16" fill="#101B2D"/>
  <rect x="720" width="480" height="400" fill="url(#grid)"/>
  <path d="M48 50H78" stroke="#7DE2C5" stroke-width="3"/>
  <text x="92" y="55" fill="#B6C4D6" font-family="Consolas, monospace" font-size="14" letter-spacing="2">VINICIUS LAGO CRUZ</text>
  <text x="48" y="157" fill="#F3F6FA" font-family="Georgia, serif" font-size="76" letter-spacing="-3">Do código</text>
  <text x="48" y="239" fill="#7DE2C5" font-family="Georgia, serif" font-size="80" font-style="italic" letter-spacing="-3">à operação.</text>
  <text x="51" y="291" fill="#B6C4D6" font-family="Segoe UI, sans-serif" font-size="18">Software que conecta produto, dados e operação.</text>
  <path d="M48 333H670" stroke="#B6C4D6" stroke-opacity=".2"/>
  <text x="50" y="365" fill="#B6C4D6" font-family="Consolas, monospace" font-size="13" letter-spacing="1">FULL STACK</text>
  <circle cx="180" cy="360" r="2" fill="#7DE2C5"/>
  <text x="202" y="365" fill="#B6C4D6" font-family="Consolas, monospace" font-size="13" letter-spacing="1">DADOS</text>
  <circle cx="282" cy="360" r="2" fill="#7DE2C5"/>
  <text x="304" y="365" fill="#B6C4D6" font-family="Consolas, monospace" font-size="13" letter-spacing="1">INFRAESTRUTURA</text>
  <g fill="#101B2D" stroke="#7DE2C5" stroke-width="1.5" stroke-linejoin="round">
    <path d="M776 258 928 175 1080 258 928 341Z" stroke-opacity=".3"/>
    <path d="M776 200 928 117 1080 200 928 283Z" stroke-opacity=".6"/>
    <path d="M776 142 928 59 1080 142 928 225Z"/>
    <path d="M776 142V258M928 225V341M1080 142V258" stroke-dasharray="3 7" stroke-opacity=".4"/>
    <path d="m870 141 40 23 75-42" stroke-width="3"/>
  </g>
  <g fill="#7DE2C5"><circle cx="776" cy="142" r="4"/><circle cx="1080" cy="200" r="4"/><circle cx="928" cy="341" r="4"/></g>
  <text x="840" y="380" fill="#B6C4D6" font-family="Consolas, monospace" font-size="12" letter-spacing="2">IDEIA → SISTEMA → USO</text>
</svg>

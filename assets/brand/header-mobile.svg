<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">Do código à operação — Vinicius Lago Cruz</title>
  <desc id="desc">Identidade de Vinicius Lago Cruz em azul profundo e verde, com foco em desenvolvimento Full Stack, dados e infraestrutura.</desc>
  <rect width="600" height="420" rx="14" fill="#101B2D"/>
  <path d="M34 43H62" stroke="#7DE2C5" stroke-width="3"/>

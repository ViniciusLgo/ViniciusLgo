  <text x="32" y="153" fill="#F3F6FA" font-family="Georgia, serif" font-size="78" letter-spacing="-3">Do código</text>
  <text x="32" y="241" fill="#7DE2C5" font-family="Georgia, serif" font-size="82" font-style="italic" letter-spacing="-3">à operação.</text>
  <text x="36" y="296" fill="#B6C4D6" font-family="Segoe UI, sans-serif" font-size="23">Software que conecta produto,</text>
